<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Your music. Your mood. Your space. Warrior Music local web player.">
  <title>Warrior Music</title>
  <link rel="icon" type="image/x-icon" href="/assets/logo.ico">
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
  <link rel="apple-touch-icon" href="/assets/logo_256.png">
  <link rel="stylesheet" href="/styles.css?v=warrior_v7">
  <script src="https://www.youtube.com/iframe_api"></script>
  <script type="module" src="/app.js?v=warrior_v7"></script>
  <style>
    /* Instant Netlify badge suppression */
    .netlify-badge, #netlify-badge, [data-netlify-badge], a[href*="netlify.com"] {
      display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important;
      position: absolute !important; width: 0 !important; height: 0 !important; z-index: -999999 !important;
    }
  </style>
  <script>
    // Remove injected Netlify badge only, never touch YouTube player iframes
    (function cleanNetlify() {
      function sweep() {
        var els = document.querySelectorAll('.netlify-badge, #netlify-badge, [data-netlify-badge], a[href*="netlify.com"]');
        for (var i = 0; i < els.length; i++) els[i].remove();
      }
      sweep();
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', sweep);
      }
      setInterval(sweep, 1000);
    })();
  </script>
</head>
<body>
  <div id="app"><div class="boot"><img src="/assets/logo.svg" alt="Warrior Music" width="64" height="64"><span class="spinner"></span></div></div>
  <div id="overlays"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>

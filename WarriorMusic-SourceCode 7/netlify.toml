[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Route API requests to Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

# Route legacy downloads
[[redirects]]
  from = "/downloads/NovaXCloudMusic-SetupV3.exe"
  to = "/downloads/WarriorMusic-Setup.exe"
  status = 302

[[redirects]]
  from = "/downloads/NovaXCloudMusic.apk"
  to = "/downloads/WarriorMusic.apk"
  status = 302

# Single Page App routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache-Control headers to ensure instant updates without caching
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
